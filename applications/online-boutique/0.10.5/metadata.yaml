overview: |
  # Online Boutique

  **Online Boutique** is a cloud-first microservices demo application developed by Google. The application is a web-based e-commerce app where users can browse items, add them to the cart, and purchase them.

  ## Architecture

  Online Boutique is composed of 11 microservices written in different languages that communicate over gRPC:

  - **Frontend** (Go): Exposes an HTTP server to serve the website
  - **Cart Service** (C#): Stores shopping cart items in Redis
  - **Product Catalog Service** (Go): Provides product list and search
  - **Currency Service** (Node.js): Converts currencies using real exchange rates
  - **Payment Service** (Node.js): Charges credit cards (mock)
  - **Shipping Service** (Go): Provides shipping cost estimates
  - **Email Service** (Python): Sends order confirmation emails (mock)
  - **Checkout Service** (Go): Orchestrates payment, shipping, and email
  - **Recommendation Service** (Python): Recommends products based on cart
  - **Ad Service** (Java): Provides contextual advertisements
  - **Load Generator** (Python/Locust): Simulates realistic user traffic

  ## Key Features

  - **Polyglot Architecture**: Services written in Go, C#, Node.js, Python, and Java
  - **gRPC Communication**: Inter-service communication using Protocol Buffers
  - **Cloud Native**: Designed for Kubernetes with best practices
  - **Realistic Demo**: Simulates a real-world e-commerce application
  - **Load Testing**: Built-in load generator for performance testing

  ## Access

  After deployment, the application is accessible via the `frontend-external` LoadBalancer service. The UI provides a fully functional e-commerce experience with product browsing, cart management, and checkout workflows.

